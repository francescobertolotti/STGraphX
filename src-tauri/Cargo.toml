[package]
name = "stgraphx-tauri"
version = "0.1.0"
description = "DSGraph, based on STGraphX: desktop shell powered by Tauri"
authors = ["Luca Mari (original work)", "Francesco Bertolotti (modifications and additional features)"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stgraphx_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
rfd = "0.15"
tauri = { version = "2", features = [] }
